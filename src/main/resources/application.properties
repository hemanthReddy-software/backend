spring.application.name=ai-chat-platform
server.port=8080

# Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:AI_CHAT}
spring.datasource.password=${DB_PASSWORD:AI_CHAT}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none

# Mail - configure your SMTP provider
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-secret-key-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAI
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}

# CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

logging.level.org.springframework.jdbc=INFO
